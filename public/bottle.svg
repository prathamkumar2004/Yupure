<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="200" height="500" fill="none">
  <!-- Bottle Cap -->
  <rect x="70" y="20" width="60" height="35" rx="6" fill="#16191D" />
  <rect x="68" y="50" width="64" height="10" rx="3" fill="#16191D" opacity="0.8" />
  <!-- Cap Texture Ribs -->
  <line x1="80" y1="25" x2="80" y2="45" stroke="#FAF8F5" stroke-width="2" opacity="0.3" />
  <line x1="90" y1="25" x2="90" y2="45" stroke="#FAF8F5" stroke-width="2" opacity="0.3" />
  <line x1="100" y1="25" x2="100" y2="45" stroke="#FAF8F5" stroke-width="2" opacity="0.3" />
  <line x1="110" y1="25" x2="110" y2="45" stroke="#FAF8F5" stroke-width="2" opacity="0.3" />
  <line x1="120" y1="25" x2="120" y2="45" stroke="#FAF8F5" stroke-width="2" opacity="0.3" />

  <!-- Bottle Neck -->
  <path d="M72 60 L78 110 C78 110 75 130 50 150 L30 165 C20 172 15 185 15 200 L15 440 C15 460 30 475 50 475 L150 475 C170 475 185 460 185 440 L185 200 C185 185 180 172 170 165 L150 150 C125 130 122 110 122 110 L128 60 Z" fill="#16191D" fill-opacity="0.04" stroke="#16191D" stroke-width="4" stroke-linejoin="round" />

  <!-- Glass Inner Glow & Liquid Level -->
  <path d="M25 210 L175 210 L175 435 C175 450 162 462 147 462 L53 462 C38 462 25 450 25 435 Z" fill="#00cad4" fill-opacity="0.08" />

  <!-- YUPURE Brand Label Area -->
  <rect x="30" y="240" width="140" height="150" rx="12" fill="#FAF8F5" stroke="#16191D" stroke-width="2" stroke-opacity="0.2" />
  
  <!-- YUPURE Water Drop Icon on Label -->
  <path d="M100 260 C100 260 82 285 82 300 C82 310 90 318 100 318 C110 318 118 310 118 300 C118 285 100 260 100 260 Z" fill="#00cad4" />
  <path d="M100 270 C100 270 88 290 88 300 C88 307 93 312 100 312 C107 312 112 307 112 300 C112 290 100 270 100 270 Z" fill="#16191D" />

  <!-- Label Brand Name Text -->
  <text x="100" y="340" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-size="16" fill="#16191D" letter-spacing="2">YUPURE</text>
  <text x="100" y="356" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="bold" fill="#16191D" opacity="0.6" letter-spacing="1">YOUR BRAND. YOUR BOTTLE.</text>

  <!-- Label 300ml Volume -->
  <text x="100" y="378" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#00cad4" font-weight="bold">300 ml</text>

  <!-- Glass Light Reflections -->
  <path d="M30 195 L30 445" stroke="#FAF8F5" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M40 190 L40 450" stroke="#FAF8F5" stroke-width="2" stroke-linecap="round" opacity="0.5" />
</svg>
